[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shakedown"
version = "0.1.0"
description = "Durable mirroring of public music archives onto a local NAS, with a hardlink seam to library tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shakedown contributors" }]
dependencies = [
    "internetarchive>=4.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1.350",
]

[project.scripts]
shakedown = "shakedown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shakedown"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportFunctionMemberAccess = false  # click decorators add .command/.group dynamically

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
