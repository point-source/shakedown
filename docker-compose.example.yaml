# Shakedown — example deployment for QNAP / any Docker host.
#
# Paste this into Container Station → Applications → Create. Edit volumes to
# match your share layout. Shakedown hardlinks archive files into the library,
# so archive and library must sit on one filesystem AND reach the container
# through ONE volume mount: mount the parent (/share/data:/data), never
# archive and library separately — Linux refuses hardlinks across separate
# mounts even on the same disk (SPEC.md §spec:system-shape). Run
# `shakedown validate` to confirm.
#
# Setup:
#   1. File Station: create /share/data/{archive,library,navidrome,shakedown-config}
#   2. File Station: upload an initial shakedown.yaml to /share/data/shakedown-config/
#      (start from shakedown.example.yaml). Inside the containers it is
#      /data/shakedown-config/shakedown.yaml, the path Shakedown reads by default.
#   3. Container Station → Applications → Create: paste this YAML and your env vars.
#      SHAKEDOWN_IMAGE is required — Create fails until you set it, e.g. to
#      ghcr.io/<owner>/shakedown:latest. To hold a version instead, use a
#      release tag such as 1.1.0.
#
# How scheduling works (SPEC.md §spec:deployment): each collection's
# `schedule` in shakedown.yaml is a five-field cron expression (`30 3 * * *`
# is daily at 03:30). shakedown-scheduler, below, starts each scheduled sync
# as a fresh one-shot run and notices a changed shakedown.yaml within a
# minute — no redeploy. A collection with no `schedule` syncs only when
# someone starts it.
#
# Nothing syncs on `up`: each collection syncs only on its own schedule. To
# sync immediately, either (a) set SHAKEDOWN_API_TOKEN and POST /sync to
# shakedown-serve (no SSH), or (b) start a one-off container from Container
# Station → Create with command `sync --collection <name>`, the same image,
# mount, and user as shakedown-serve.
#
# `user` keeps every Shakedown container on ONE owner: root-owned files would
# lock the other containers and manual runs out. Set SHAKEDOWN_USER (uid:gid)
# to the owner of /share/data/archive, /share/data/library, and
# /share/data/shakedown-config; it defaults to the image's user, 1000:1000.

services:
  # shakedown-serve: the web dashboard and its GET /api/* data, plus the
  # control plane (GET /status, GET /metrics for Prometheus, ad-hoc triggers).
  # It runs all the time because the dashboard needs it, and it writes
  # shakedown.yaml when you save settings in the dashboard.
  #
  # The dashboard and its GET /api/* data have no login of their own, like
  # GET /status: put serve behind your reverse proxy (e.g. Authelia) and let
  # the proxy decide who opens it. The port is published on loopback only, so
  # the proxy is the one way in: anyone who reached it directly would see
  # operational data (counts, paths, timings, errors — never credentials) and
  # could change settings. A proxy on the host uses http://127.0.0.1:8080; a
  # proxy in another container on this stack's network uses
  # http://shakedown-serve:8080.
  #
  # SHAKEDOWN_API_TOKEN is optional. It lets scripts and curl call the
  # mutating endpoints (POST /sync, POST /verify, POST /validate, and live
  # handoff validation, which takes the token only). Unset, only the
  # dashboard's own page can start runs. Trigger a sync
  # through the proxy (or with http://127.0.0.1:8080 on the host itself):
  #   curl -XPOST -H "Authorization: Bearer $SHAKEDOWN_API_TOKEN" \
  #     "https://<serve behind your proxy>/sync?collection=grateful-dead"
  #
  # serve and the scheduler each start runs themselves, so both get the same
  # image, data mount, user, and environment. Download-restricted collections
  # only: uncomment the IA_* lines on BOTH and set IA_EMAIL / IA_PASSWORD. The
  # values are visible via `docker inspect` — omit them unless a collection
  # needs authentication. TZ is the clock for schedules when shakedown.yaml
  # sets no `timezone`, and for log times (an IANA name such as Europe/Berlin).
  shakedown-serve:
    image: "${SHAKEDOWN_IMAGE:?set SHAKEDOWN_IMAGE to ghcr.io/<owner>/shakedown:latest}"
    container_name: shakedown-serve
    user: "${SHAKEDOWN_USER:-1000:1000}"
    restart: unless-stopped
    # On stop, serve stops the runs it started and waits for them (up to 90 s).
    stop_grace_period: 2m
    volumes:
      - /share/data:/data
    environment:
      - SHAKEDOWN_API_TOKEN=${SHAKEDOWN_API_TOKEN:-}
      - TZ=${TZ:-UTC}
      # - IA_EMAIL=${IA_EMAIL:-}
      # - IA_PASSWORD=${IA_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]

  # shakedown-scheduler: starts each collection's scheduled syncs. It listens
  # on no port and never writes the config: the config folder is mounted again,
  # read-only, over the data share, so no scheduled run can rewrite it.
  # Scheduled runs log to THIS container's log.
  #
  # Its health is its heartbeat: `shakedown schedule --check` fails when the
  # scheduler has not reported for three minutes. It also shows unhealthy until
  # shakedown.yaml exists, because the heartbeat is kept in the state database
  # the config names. Without this container, scheduled syncs do not run, and
  # a tick missed while it is stopped is shown in the dashboard, not caught up.
  shakedown-scheduler:
    image: "${SHAKEDOWN_IMAGE:?set SHAKEDOWN_IMAGE to ghcr.io/<owner>/shakedown:latest}"
    container_name: shakedown-scheduler
    user: "${SHAKEDOWN_USER:-1000:1000}"
    restart: unless-stopped
    # On stop, the scheduler stops the runs it started and waits for them.
    stop_grace_period: 2m
    volumes:
      - /share/data:/data
      - /share/data/shakedown-config:/data/shakedown-config:ro
    environment:
      - TZ=${TZ:-UTC}
      # - IA_EMAIL=${IA_EMAIL:-}
      # - IA_PASSWORD=${IA_PASSWORD:-}
    command: ["schedule"]
    healthcheck:
      test: ["CMD", "shakedown", "schedule", "--check"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 3m

  # Listening: Navidrome reads Shakedown's library tree directly. Its folder
  # watcher (on by default) picks up each newly synced show on its own, so no
  # handoff is configured. Open http://host:4533 and create the admin user on
  # first visit. The library is mounted read-only: Navidrome never changes it.
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - /share/data/library:/music:ro
      - /share/data/navidrome:/data
