# Shakedown — example deployment for QNAP / any Docker host.
#
# Paste this into Container Station → Applications → Create. Edit volumes to
# match your share layout. Shakedown hardlinks archive files into the library,
# so archive and library must sit on one filesystem AND reach the container
# through ONE volume mount: mount the parent (/share/data:/data), never
# archive and library separately — Linux refuses hardlinks across separate
# mounts even on the same disk (SPEC.md §spec:system-shape). Run
# `shakedown validate` to confirm.
#
# Setup:
#   1. File Station: create /share/data/{archive,library,navidrome,shakedown-config}
#   2. File Station: upload an initial shakedown.yaml to /share/data/shakedown-config/
#   3. Container Station → Applications → Create: paste this YAML and your env vars.
#      SHAKEDOWN_IMAGE is required — Create fails until you set it, e.g. to
#      ghcr.io/<owner>/shakedown:latest. Ofelia pulls the image before every
#      tick, so `latest` updates Shakedown automatically to each release that
#      passed CI. To hold a version instead, use a release tag such as 1.1.0.
#
# How scheduling works (SPEC.md §spec:deployment): ofelia is the only
# long-running Shakedown service (navidrome, below, is how you listen). On each cron tick it launches a FRESH shakedown
# container (ofelia job-run), which runs one `sync` and exits — matching
# shakedown's one-shot, stateless-between-runs design. There is no idle
# shakedown service to attach to. Change a schedule by editing the ofelia
# labels in this file (Container Station → edit compose).
#
# Nothing syncs on `up`: each collection syncs only on its own schedule. To
# sync immediately without waiting for the next tick, either (a) uncomment the
# serve control plane below and POST /sync (no SSH), or (b) start a one-off
# container from Container Station → Create with command
# `sync --collection <name>`, the same mounts, and user SHAKEDOWN_USER —
# the manual equivalent of a tick.

services:
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: shakedown-ofelia
    command: daemon --docker
    restart: unless-stopped
    volumes:
      # Read-only docker socket: ofelia needs it to start per-tick containers.
      # This grants host-root-equivalent access — place the stack accordingly.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # One job per collection. Each tick starts a fresh shakedown container
      # from the image, runs one sync, then is removed (job-run + delete), so
      # the run's output lands in THIS container's (shakedown-ofelia) log.
      # Every label of a job must share one `ofelia.job-run.<name>.` prefix; a
      # mismatched job type or name fails only in that log. After Create,
      # check it shows one "New job registered" line per collection.
      # The mounts mirror a manual run: the whole data share as one volume
      # (hardlinks need it), plus config at /config. The config folder is
      # also mounted read-only inside /data, so no run can rewrite it. The
      # entrypoint is `shakedown --config /config/shakedown.yaml`, so `command`
      # only carries the subcommand. Slice values (volume/environment) are
      # JSON arrays.
      #
      # `user` keeps every Shakedown container on ONE owner. Without it ofelia
      # runs jobs as root, and root-owned files then lock out serve and manual
      # runs. Set SHAKEDOWN_USER (uid:gid) to the owner of /share/data/archive
      # and /share/data/library; it defaults to the image's user, 1000:1000.
      ofelia.job-run.dead-sync.schedule: "0 0 3 * * 0"   # Sunday 03:00
      ofelia.job-run.dead-sync.image: "${SHAKEDOWN_IMAGE:?set SHAKEDOWN_IMAGE to ghcr.io/<owner>/shakedown:latest}"
      ofelia.job-run.dead-sync.command: "sync --collection grateful-dead"
      ofelia.job-run.dead-sync.volume: '["/share/data:/data", "/share/data/shakedown-config:/data/shakedown-config:ro", "/share/data/shakedown-config:/config:ro"]'
      ofelia.job-run.dead-sync.delete: "true"
      ofelia.job-run.dead-sync.user: "${SHAKEDOWN_USER:-1000:1000}"
      # Download-restricted collections only: uncomment to pass IA credentials
      # to this job. If any collection needs them, give them to EVERY job: a
      # job whose sync finishes also syncs the collections whose ticks it
      # blocked, so it may run the restricted one. NOTE: values embedded here
      # are visible via `docker inspect` on the ofelia container — omit unless
      # a collection actually needs authentication.
      # ofelia.job-run.dead-sync.environment: '["IA_EMAIL=${IA_EMAIL:-}", "IA_PASSWORD=${IA_PASSWORD:-}"]'

      ofelia.job-run.phish-sync.schedule: "0 0 4 * * 0"  # Sunday 04:00
      ofelia.job-run.phish-sync.image: "${SHAKEDOWN_IMAGE:?set SHAKEDOWN_IMAGE to ghcr.io/<owner>/shakedown:latest}"
      ofelia.job-run.phish-sync.command: "sync --collection phish"
      ofelia.job-run.phish-sync.volume: '["/share/data:/data", "/share/data/shakedown-config:/data/shakedown-config:ro", "/share/data/shakedown-config:/config:ro"]'
      ofelia.job-run.phish-sync.delete: "true"
      ofelia.job-run.phish-sync.user: "${SHAKEDOWN_USER:-1000:1000}"
      # ofelia.job-run.phish-sync.environment: '["IA_EMAIL=${IA_EMAIL:-}", "IA_PASSWORD=${IA_PASSWORD:-}"]'

  # Optional: HTTP control plane for ad-hoc triggers + Prometheus metrics.
  # This is the recommended no-SSH way to trigger a sync on demand. Uncomment
  # and set SHAKEDOWN_API_TOKEN if you want it. Mutating endpoints authenticate
  # with a standard bearer token; with no token set they are disabled (not
  # open). Trigger a sync with:
  #   curl -XPOST -H "Authorization: Bearer $SHAKEDOWN_API_TOKEN" \
  #     "http://host:8080/sync?collection=grateful-dead"
  #
  # serve starts each triggered sync/verify as its own run, so it needs the
  # same image, mounts, and user as the ofelia job (and the IA credentials env
  # if a collection needs them).
  # shakedown-serve:
  #   image: "${SHAKEDOWN_IMAGE:?set SHAKEDOWN_IMAGE to ghcr.io/<owner>/shakedown:latest}"
  #   container_name: shakedown-serve
  #   user: "${SHAKEDOWN_USER:-1000:1000}"
  #   restart: unless-stopped
  #   volumes:
  #     - /share/data:/data
  #     - /share/data/shakedown-config:/data/shakedown-config:ro
  #     - /share/data/shakedown-config:/config:ro
  #   environment:
  #     - SHAKEDOWN_API_TOKEN=${SHAKEDOWN_API_TOKEN}
  #   ports:
  #     - "8080:8080"
  #   command: ["serve", "--host", "0.0.0.0", "--port", "8080"]

  # Listening: Navidrome reads Shakedown's library tree directly. Its folder
  # watcher (on by default) picks up each newly synced show on its own, so no
  # handoff is configured. Open http://host:4533 and create the admin user on
  # first visit. The library is mounted read-only: Navidrome never changes it.
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      - /share/data/library:/music:ro
      - /share/data/navidrome:/data
