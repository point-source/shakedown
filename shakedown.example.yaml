# Shakedown — example configuration. See SPEC.md §spec:configuration.
# Place this at /share/data/shakedown-config/shakedown.yaml on a QNAP setup.

archive_root: /data/archive
library_root: /data/library
state_db: /data/archive/.shakedown/state.db

# Global concurrency caps. `max_concurrent_downloads` bounds parallel file
# downloads within one collection; `max_concurrent_collections` bounds how many
# collections sync in parallel. Total fetch threads are the product of the two.
max_concurrent_downloads: 4
max_concurrent_collections: 2

sources:
  - name: internetarchive
    type: ia
    # Per-source politeness ceiling: the hard cap on simultaneous connections
    # Shakedown opens to this source's upstream host, shared across ALL of the
    # source's collections and spanning discovery metadata calls + file downloads
    # (SPEC.md §spec:source-budget). Bounds total upstream concurrency even when
    # several of this source's collections sync at once. Sources on the same host
    # (this one and etree-lma below both reach archive.org) share one cap: the
    # smallest either sets. Falls back to max_concurrent_downloads when unset.
    max_concurrent_requests: 4
    auth:
      # Only needed for download-restricted items. Leave unset to skip auth.
      email_env: IA_EMAIL
      password_env: IA_PASSWORD
    collections:
      - name: grateful-dead
        query: 'collection:GratefulDead'
        # There are no file settings: every show keeps its best copy, a copy a common
        # player reads when the best one isn't (e.g. MP3 beside SHN), and every
        # non-audio file (SPEC.md §spec:quality-selection).
        # Template renders the staging *directory*; original filenames are appended
        # automatically (SPEC.md §spec:library-staging). Available IA fields: identifier, title, creator,
        # date, year, venue, coverage. Filters: sanitize, short, lower, upper. Every field
        # has path-unsafe characters replaced even without `|sanitize`. End the layout
        # with {identifier}: one show
        # often has several recordings, and each needs its own folder.
        library_layout: '{year}/{date} - {venue}/{identifier}'
        # Opt-in metadata preservation (SPEC.md §spec:metadata-preservation): write the
        # item's raw source metadata as a `metadata.json` sidecar into the archive item
        # directory and hardlink it into the library beside the media, so a browsed folder
        # carries its own lineage/notes/setlist context. Off by default. The sidecar is
        # excluded from change detection — an upstream notes edit never re-fetches media;
        # run `shakedown sync --refresh-metadata` to explicitly re-pull and rewrite it.
        preserve_source_metadata: false
        # Opt-in tag filling (SPEC.md §spec:tag-filling): fill in missing artist, album,
        # date, venue, and track title tags from archive.org's metadata, so shows group
        # and display correctly in Navidrome. Tags already present are never changed.
        # Off by default; when on, the archive copy carries the filled tags too.
        fill_tags: false
        # No handoff is needed to listen: Navidrome in the example compose stack
        # watches the library tree and picks up new shows on its own. To tell
        # your own receiver about new shows instead, set one of these (both are
        # placeholders — point them at a receiver you run). See docs/handoff.md.
        # on_complete:
        #   webhook: http://your-receiver.example/shakedown?collection={collection}
        #   # or: exec: /path/to/your-command {staging_root}

      - name: phish
        query: 'collection:Phish'
        # Default library_layout is `passthrough`: mirrors the archive layout 1:1.
        # Opt-in fast-path for recurring no-op syncs (SPEC.md §spec:incremental-discovery):
        # when the source's cheap change signal is unchanged, skip the per-item metadata
        # fetch and classify the item `unchanged` without it. Off by default — a changed
        # or absent signal always falls through to the full manifest comparison, and
        # `verify --deep` stays the byte-level safety net.
        incremental_discovery: false

  # The etree Live Music Archive. A second, independently written source plugin
  # that talks to archive.org's public HTTP/JSON API directly (httpx), rather
  # than through the official `internetarchive` package the `ia` source uses.
  - name: etree-lma
    type: etree
    collections:
      - name: etree-lma
        # Leave out collections the internetarchive source already mirrors, so
        # no show is downloaded and linked twice.
        query: 'collection:etree AND NOT collection:GratefulDead AND NOT collection:Phish'
        # Available etree fields: identifier, title, creator, date, year,
        # venue, coverage. Filters: sanitize, short, lower, upper.
        library_layout: '{year}/{date} - {venue}/{identifier}'

# Optional alert when a run fails. Placeholder: point it at a receiver you run
# (for example an ntfy topic URL). See docs/handoff.md.
# notifications:
#   on_failure:
#     webhook: http://your-ntfy.example/shakedown
